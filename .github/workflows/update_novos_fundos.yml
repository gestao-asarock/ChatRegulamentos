name: Indexar últimos N fundos

on:
  workflow_dispatch:
    inputs:
      quantidade:
        description: 'Quantidade de fundos (últimas linhas de cnpjs.txt) a processar'
        required: true
        default: '1'
        type: number

jobs:
  update-novos-fundos:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Filtrar cnpjs.txt para os últimos ${{ inputs.quantidade }} fundos
        run: |
          python - <<'EOF'
          import sys
          n = int("${{ inputs.quantidade }}")
          linhas = [l.strip() for l in open("cnpjs.txt").readlines() if l.strip()]
          ultimos = linhas[-n:]
          open("cnpjs.txt", "w").write("\n".join(ultimos) + "\n")
          print(f"Processando {len(ultimos)} CNPJ(s):")
          for c in ultimos:
              print(f"  {c}")
          EOF

      - name: Instalar dependências do pipeline
        run: python -m pip install -r requirements-pipeline.txt

      - name: Baixar PDFs da CVM
        env:
          PYTHONUNBUFFERED: "1"
        run: python download_cvm.py

      - name: Converter PDFs para Markdown
        run: python pdf_to_md.py

      - name: Indexar documentos no Supabase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python md_to_index.py
