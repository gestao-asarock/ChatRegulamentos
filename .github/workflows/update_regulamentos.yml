name: Atualização semanal de regulamentos

on:
  schedule:
    - cron: '0 6 * * 1'  # toda segunda-feira às 06:00 UTC
  workflow_dispatch:       # permite disparo manual pelo GitHub

jobs:
  update-regulamentos:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pipeline.txt

      - name: Instalar dependências do pipeline
        run: pip install -r requirements-pipeline.txt

      - name: Baixar PDFs da CVM
        run: python download_cvm.py

      - name: Converter PDFs para Markdown
        run: python pdf_to_md.py

      - name: Indexar documentos no Supabase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python md_to_index.py
