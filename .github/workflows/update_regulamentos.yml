name: Atualização semanal de regulamentos

on:
  schedule:
    - cron: '0 21 * * 1'  # toda segunda-feira às 18:00 BRT (21:00 UTC)
  workflow_dispatch:       # permite disparo manual pelo GitHub

jobs:
  update-regulamentos:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar dependências do pipeline
        run: python -m pip install -r requirements-pipeline.txt

      - name: Baixar PDFs da CVM
        env:
          PYTHONUNBUFFERED: "1"
        run: python download_cvm.py

      - name: Converter PDFs para Markdown
        run: python pdf_to_md.py

      - name: Indexar documentos no Supabase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python md_to_index.py
